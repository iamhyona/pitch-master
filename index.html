<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pitch Master</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#0d0d0f;--sur:#16161a;--sur2:#1e1e24;--bdr:#2a2a35;
  --acc:#3b82f6;--acc2:#93c5fd;--danger:#ff5f5f;
  --txt:#e8e8ed;--txt2:#8888a0;--txt3:#5a5a70;
  --grn:#34d399;--gold:#fbbf24;--teal:#22d3ee;--purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.5;color-scheme:dark}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* 로그인 */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
#login-screen.hidden{display:none}
.login-box{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;width:100%;max-width:340px;padding:32px 28px}
.login-logo{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:var(--acc2);letter-spacing:.05em;margin-bottom:6px}
.login-sub{font-size:12px;color:var(--txt3);margin-bottom:28px}
.login-role-btns{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.role-btn{flex:1;max-width:130px;padding:13px 4px;background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--txt3);cursor:pointer;transition:all .15s;text-align:center;font-weight:500}
.role-btn:hover{border-color:var(--acc);color:var(--acc2)}
.role-btn.selected{background:rgba(59,130,246,.12);border-color:var(--acc);color:var(--acc2);font-weight:600}
.login-pw-wrap{display:none;gap:8px;margin-bottom:8px}
.login-pw-wrap.show{display:flex}
.login-err{font-size:11px;color:var(--danger);min-height:16px;margin-bottom:10px}
.login-btn{width:100%;height:44px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.login-btn:disabled{opacity:.35;cursor:not-allowed}

/* 헤더 */
header{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;align-items:center;height:52px;flex-shrink:0;gap:8px}
.logo{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--acc2);flex:1}
.logo span{color:var(--txt2);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:0 12px;height:30px;border-radius:7px;font-size:12px;font-family:'Noto Sans KR',sans-serif;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:#2563eb}
.btn-g{background:transparent;color:var(--txt2);border:1px solid var(--bdr)}.btn-g:hover{color:var(--txt)}
.btn-danger{background:var(--danger);color:#fff}

/* 탭 */
.tabs-wrapper{background:var(--sur);border-bottom:1px solid var(--bdr);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs-wrapper::-webkit-scrollbar{display:none}
.tabs{display:flex;padding:0 10px;min-width:max-content}
.tab{padding:0 14px;height:44px;display:flex;align-items:center;cursor:pointer;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--txt3);border-bottom:2px solid transparent;transition:all .2s;user-select:none;white-space:nowrap}
.tab:hover{color:var(--txt2)}
.tab.active{color:var(--txt);border-bottom-color:var(--acc)}

/* 콘텐츠 */
.content{flex:1;overflow-y:auto}
.content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
.ci{padding:16px 20px 80px;max-width:1100px;margin:0 auto}
.tab-panel{display:none}.tab-panel.active{display:block}

/* 카드/테이블 공통 */
.tc{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tc-h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bdr);gap:8px}
.tc-t{font-size:13px;font-weight:600;flex:1}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 12px;text-align:left;font-size:10px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bdr);background:var(--sur2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(42,42,53,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}

/* 토글 행 */
.tr-main{cursor:pointer}
.tr-main:hover td{background:rgba(59,130,246,.04)}
.tr-detail{display:none}
.tr-detail.open{display:table-row}
.tr-detail td{background:var(--sur2);padding:0}
.chv{display:inline-block;transition:transform .2s;color:var(--txt3);font-size:12px;width:16px;text-align:center}
.chv.open{transform:rotate(90deg)}

/* ── 토글 상세 정보 (왼쪽 정렬, 그리드) ── */
/* ── 토글 상세 패널 (key-value 리스트) ── */
.detail-panel{border-top:1px solid var(--bdr);background:var(--sur2)}
.detail-list{display:flex;flex-direction:column}
.detail-row{display:flex;align-items:baseline;padding:8px 16px;border-bottom:1px solid rgba(42,42,53,.4);gap:0}
.detail-row:last-child{border-bottom:none}
.detail-k{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;width:108px;min-width:108px;padding-top:1px}
.detail-v{font-size:12px;font-weight:500;color:var(--txt);cursor:pointer;padding:2px 7px;border-radius:5px;transition:all .15s;word-break:break-all;flex:1;line-height:1.5}
.detail-v:hover{background:rgba(59,130,246,.12);color:var(--acc2)}
.detail-v.copied{background:rgba(52,211,153,.12);color:var(--grn);transition:none}
.detail-section-label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;padding:10px 16px 4px;border-bottom:1px solid var(--bdr);background:rgba(0,0,0,.15)}
.detail-contact-row{display:flex;align-items:baseline;padding:7px 16px;border-bottom:1px solid rgba(42,42,53,.3);gap:0}
.detail-contact-row:last-child{border-bottom:none}
.detail-contact-k{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;width:60px;min-width:60px}
.detail-contact-v{font-size:12px;font-weight:500;cursor:pointer;padding:2px 7px;border-radius:5px;transition:all .15s;word-break:break-all;flex:1}
.detail-contact-v:hover{background:rgba(59,130,246,.12);color:var(--acc2)}
.detail-contact-v.copied{background:rgba(52,211,153,.12);color:var(--grn)}
@media(max-width:399px){
  .detail-k{width:80px;min-width:80px}
  .detail-contact-k{width:48px;min-width:48px}
}

/* sub-table removed */

/* 복사 커서 */
.copyable{cursor:pointer;transition:all .15s;border-radius:4px;padding:1px 3px}
.copyable:hover{background:rgba(59,130,246,.12);color:var(--acc2)}
.copyable.copied{background:rgba(52,211,153,.15);color:var(--grn)}

/* 태그 */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.t-b{background:rgba(59,130,246,.15);color:var(--acc2)}
.t-g{background:rgba(251,191,36,.12);color:var(--gold)}
.t-t{background:rgba(34,211,238,.12);color:var(--teal)}
.t-x{background:var(--sur2);color:var(--txt2)}
.nm{font-weight:600;font-size:13px}

/* 검색/필터 */
.srch{display:flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:0 12px;height:36px;flex:1}
.srch input{background:none;border:none;outline:none;color:var(--txt);font-size:13px;font-family:'Noto Sans KR',sans-serif;flex:1}
.srch input::placeholder{color:var(--txt3)}
.ftabs{display:flex;gap:3px}
.ft{padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;color:var(--txt3);background:none;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.ft:hover{color:var(--txt2)}
.ft.on{background:rgba(59,130,246,.18);color:var(--acc2);font-weight:600}

/* 페이지네이션 */
.pg{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--bdr)}
.pg-info{font-size:11px;color:var(--txt3)}
.pg-btns{display:flex;gap:2px}
.pg-btn{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid transparent;color:var(--txt3);transition:all .15s}
.pg-btn:hover{background:var(--sur2);color:var(--txt)}
.pg-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* 모달 */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.mo.open{display:flex}
.md{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto}
.md-h{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.md-t{font-size:14px;font-weight:700}
.md-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.md-f{padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end}
.xb{cursor:pointer;color:var(--txt3);font-size:18px;background:none;border:none;line-height:1}
.xb:hover{color:var(--txt)}
.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:3px;display:block}
.fg{margin-bottom:0}
.fi{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:9px 11px;color:var(--txt);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--acc)}.fi::placeholder{color:var(--txt3)}
.fi.sm{padding:7px 10px;font-size:12px}
select.fi option{background:var(--sur2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hr{border:none;border-top:1px solid var(--bdr);margin:2px 0}

/* 단가표 */
.rate-val{font-size:11px;color:var(--acc2);text-align:right}
.base-val{font-size:11px;color:var(--gold);font-weight:600;text-align:right}
.proj-nm{font-weight:600;font-size:12px}

/* 대시보드 스탯 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sc{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:14px}
.sc-l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.sc-v{font-size:24px;font-weight:700;line-height:1.2}
.sc-s{font-size:11px;color:var(--txt3);margin-top:2px}
.sc.a .sc-v{color:var(--acc2)}.sc.t .sc-v{color:var(--teal)}

/* 토스트 */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sur);border:1px solid var(--bdr);color:var(--txt);padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 모바일 카드 */
@media(max-width:599px){
  .desktop-only{display:none!important}
  .mobile-cards{display:block}
}
@media(min-width:600px){
  .mobile-cards{display:none!important}
  .desktop-only{display:block}
}
.mobile-cards{padding:6px 0}
.mc{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;margin-bottom:8px;overflow:hidden}
.mc.open{border-color:var(--acc)}
.mc-head{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.mc-info{flex:1;min-width:0}
.mc-name{font-size:13px;font-weight:700;color:var(--txt)}
.mc-sub{font-size:11px;color:var(--txt3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mc-chv{font-size:13px;color:var(--txt3);transition:transform .2s;display:inline-block}
.mc.open .mc-chv{transform:rotate(90deg)}
.mc-body{display:none;border-top:1px solid var(--bdr);padding:12px 14px}
.mc.open .mc-body{display:block}
.mc-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(42,42,53,.35);gap:12px}
.mc-row:last-child{border-bottom:none}
.mc-k{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;padding-top:3px;flex-shrink:0;min-width:72px;font-weight:600}
.mc-v{font-size:12px;font-weight:500;text-align:left;cursor:pointer;word-break:break-all;padding:2px 6px;border-radius:4px;transition:all .15s;flex:1}
.mc-v:hover{background:rgba(59,130,246,.12);color:var(--acc2)}
.mc-v.copied{background:rgba(52,211,153,.12);color:var(--grn)}
.mc-section{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 0 4px;border-bottom:1px solid var(--bdr);margin-bottom:4px}
.mc-contact{padding:6px 0;border-bottom:1px solid rgba(42,42,53,.25)}
.mc-contact:last-child{border-bottom:none}
.mc-contact-name{font-size:12px;font-weight:600;cursor:pointer;padding:1px 4px;border-radius:3px;display:inline-block}
.mc-contact-name:hover{background:rgba(59,130,246,.1);color:var(--acc2)}
.mc-contact-email{font-size:11px;color:var(--acc2);margin-top:2px;cursor:pointer;padding:1px 4px;border-radius:3px;display:inline-block}
.mc-contact-email:hover{background:rgba(59,130,246,.1)}
.mc-contact-email.copied,.mc-contact-name.copied{background:rgba(52,211,153,.12);color:var(--grn)}
.mc-actions{display:flex;gap:6px;justify-content:flex-end;padding-top:8px;border-top:1px solid rgba(42,42,53,.3);margin-top:6px}
.ab{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--bdr);color:var(--txt3);background:transparent;font-size:12px}
.ab.ed:hover{color:var(--acc2);border-color:var(--acc2)}
.ab.dl:hover{color:var(--danger);border-color:var(--danger)}

/* 게스트 안내 */
.guest-notice{font-size:11px;color:var(--txt3);background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.2);border-radius:8px;padding:8px 12px;margin-bottom:12px}

/* ── 단가표 레이아웃 ── */
/* 소속사 박스 */
.rate-agency-box{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rate-agency-label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.09em;padding:10px 14px 6px}
.rate-agency-wrap{overflow-x:auto;scrollbar-width:none;padding:0 8px 10px}
.rate-agency-wrap::-webkit-scrollbar{display:none}
.rate-agency-tabs{display:flex;gap:4px;min-width:max-content}
.rate-agency-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:var(--txt3);background:var(--sur2);border:1px solid var(--bdr);font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap}
.rate-agency-btn:hover{color:var(--txt);border-color:#6b7280}
.rate-agency-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
/* 리터쳐 박스 */
.rate-litter-box{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rate-litter-label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.09em;padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between}
.rate-litter-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 12px;align-items:center}
.rate-litter-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;color:var(--txt3);background:var(--sur2);border:1px solid var(--bdr);font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap}
.rate-litter-btn:hover{color:var(--txt);border-color:#6b7280}
.rate-litter-btn.on{background:rgba(59,130,246,.18);color:var(--acc2);border-color:var(--acc);font-weight:600}
/* 단가 테이블 박스 */
.rate-table-box{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.rate-table-box .tbl-wrap table{min-width:0}
.rate-table-box th{text-align:right;padding:8px 12px}
.rate-table-box th:first-child{text-align:left}
.rate-table-box td{text-align:right}
.rate-table-box td:first-child{text-align:left}
/* 모바일 단가 카드 */
.rate-mc{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rate-mc-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--sur2);border-bottom:1px solid var(--bdr)}
.rate-mc-proj{font-size:13px;font-weight:700}
.rate-mc-base{font-size:13px;font-weight:700;color:var(--gold)}
/* 기본단가만 보기일 땐 body 숨김 */
.rate-mc-body{padding:10px 14px;display:flex;flex-direction:column;gap:0}
.rate-mc-body:empty{display:none;padding:0}
.rate-mc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(42,42,53,.35)}
.rate-mc-row:last-child{border-bottom:none}
.rate-mc-k{font-size:11px;color:var(--txt3);font-weight:500}
.rate-mc-v{font-size:12px;font-weight:600;color:var(--acc2)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">PITCH <span style="color:var(--txt2);font-weight:400">MASTER</span></div>
    <div class="login-sub">접속 유형을 선택하고 비밀번호를 입력해주세요</div>
    <div class="login-role-btns">
      <button class="role-btn" id="rb-guest" onclick="selectRole('guest',this)">게스트</button>
      <button class="role-btn" id="rb-admin" onclick="selectRole('admin',this)">관리자</button>
    </div>
    <div class="login-pw-wrap" id="login-pw-wrap">
      <input class="fi" id="login-pw" type="password" placeholder="비밀번호" style="letter-spacing:.15em" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-p" onclick="doLogin()" style="flex-shrink:0;height:40px;padding:0 16px">확인</button>
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()" disabled>접속</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo">PITCH<span> MASTER</span></div>
    <span id="role-tag"></span>
    <button class="btn btn-g" id="edit-mode-btn" onclick="toggleEditMode()" style="display:none">편집하기</button>
    <button class="btn btn-g" onclick="doLogout()">로그아웃</button>
  </header>
  <div class="tabs-wrapper">
    <div class="tabs" id="main-tabs">
      <div class="tab active" data-tab="dash" id="tab-btn-dash">대시보드</div>
      <div class="tab" data-tab="agencies">거래처</div>
      <div class="tab" data-tab="litt">리터쳐</div>
      <div class="tab" data-tab="rates" id="tab-btn-rates">단가표</div>
    </div>
  </div>
  <div class="content">
    <div class="ci">

      <!-- 대시보드 -->
      <div id="tab-dash" class="tab-panel active">
        <div class="stats">
          <div class="sc a"><div class="sc-l">거래처</div><div class="sc-v" id="s-ag">0</div><div class="sc-s">소속사</div></div>
          <div class="sc t"><div class="sc-l">리터쳐</div><div class="sc-v" id="s-lt">0</div><div class="sc-s">등록</div></div>
        </div>

var PW = {guest:'guest', admin:'0090'};
var SESSION = {role:null, editMode:false};
var selRole = null;

function selectRole(role, el) {
  selRole = role;
  document.querySelectorAll('.role-btn').forEach(function(b){b.classList.remove('selected');});
  el.classList.add('selected');
  document.getElementById('login-pw-wrap').classList.add('show');
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-btn').disabled = false;
  setTimeout(function(){document.getElementById('login-pw').focus();}, 80);
}
function doLogin() {
  if (!selRole) { document.getElementById('login-err').textContent = '접속 유형을 선택해주세요'; return; }
  var pw = document.getElementById('login-pw').value;
  if (pw !== PW[selRole]) {
    document.getElementById('login-err').textContent = '비밀번호가 틀렸어요';
    document.getElementById('login-pw').value = '';
    document.getElementById('login-pw').focus();
    return;
  }
  SESSION.role = selRole; SESSION.editMode = false;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  applyRoleUI(); buildRateTabs(); renderAll();
}
function doLogout() {
  SESSION.role = null; SESSION.editMode = false; selRole = null;
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').style.display = 'none';
  document.querySelectorAll('.role-btn').forEach(function(b){b.classList.remove('selected');});
  document.getElementById('login-pw-wrap').classList.remove('show');
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').textContent = '';
  document.getElementById('login-btn').disabled = true;
  CUR = 'dash';
}
function applyRoleUI() {
  var isAdmin = SESSION.role === 'admin';
  var c = isAdmin ? ['rgba(59,130,246,.12)','var(--acc2)'] : ['rgba(167,139,250,.12)','var(--purple)'];
  document.getElementById('role-tag').innerHTML = '<span style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;background:'+c[0]+';color:'+c[1]+'">'+(isAdmin?'관리자':'게스트')+'</span>';
  document.getElementById('edit-mode-btn').style.display = isAdmin ? '' : 'none';
  document.getElementById('tab-btn-rates').style.display = isAdmin ? '' : 'none';
  document.getElementById('tab-btn-dash').style.display = isAdmin ? '' : 'none';
  if (!isAdmin) {
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.querySelector('[data-tab="agencies"]').classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
    document.getElementById('tab-agencies').classList.add('active');
    CUR = 'agencies';
  }
  updateEditUI();
}
function toggleEditMode() {
  SESSION.editMode = !SESSION.editMode;
  var btn = document.getElementById('edit-mode-btn');
  if (SESSION.editMode) { btn.textContent='편집 종료'; btn.classList.add('btn-danger'); btn.classList.remove('btn-g'); }
  else { btn.textContent='편집하기'; btn.classList.remove('btn-danger'); btn.classList.add('btn-g'); }
  updateEditUI(); renderAll();
  toast(SESSION.editMode ? '편집 모드 켜짐' : '편집 모드 꺼짐');
}
function updateEditUI() {
  var show = SESSION.role === 'admin' && SESSION.editMode;
  document.getElementById('btn-add-ag').style.display = show ? '' : 'none';
  document.getElementById('btn-add-lt').style.display = show ? '' : 'none';
  document.getElementById('btn-edit-rate').style.display = show ? '' : 'none';
}
function isAdmin(){return SESSION.role==='admin';}
function canEdit(){return SESSION.role==='admin'&&SESSION.editMode;}

// ── 유틸 ──
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function wn(n){if(!n||isNaN(n))return '-';return Number(n).toLocaleString('ko-KR')+'원';}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():'';}

// ── 클립보드 복사 (file:// 포함 모든 환경에서 작동) ──
function cp(text, el) {
  if(!text||text==='-')return;
  // 시각 피드백 함수
  function feedback() {
    toast('복사됨! ' + text.slice(0,24)+(text.length>24?'…':''));
    if(el){
      el.classList.add('copied');
      setTimeout(function(){el.classList.remove('copied');},1400);
    }
  }
  // 1) 최신 Clipboard API (HTTPS / localhost)
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(feedback).catch(function(){
      fallbackCopy(text, feedback);
    });
  } else {
    fallbackCopy(text, feedback);
  }
}

// execCommand 기반 fallback (file://, 구형 브라우저)
function fallbackCopy(text, callback) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  ta.setSelectionRange(0, ta.value.length); // iOS
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if(callback) callback();
}

// 클릭 가능한 td용 (이벤트 전파 막으면서 복사)
function cpCell(e, text) {
  e.stopPropagation();
  cp(text, e.currentTarget);
}

function switchTab(t){
  if((t==='rates'||t==='dash')&&SESSION.role==='guest'){toast('관리자만 접근 가능해요');return;}

  CUR=t;agP=0;ltP=0;rtP=0;

}

function renderDash(){

      '<td class="nm" id="dlt-nm-'+i+'">'+esc(l.name)+'</td>'

    (function(el,v){el.addEventListener('click',function(e){e.stopPropagation();cp(v,el);});})(tr.querySelector('#dlt-rid-'+i), l.regId||'');
    (function(el,v){el.addEventListener('click',function(e){e.stopPropagation();cp(v,el);});})(tr.querySelector('#dlt-ac-'+i), acct);

// ── 단가표 ──
var ALL_COLS=['김현수','박현아','강영순','최현경','이은지','권미향','기타'];
var selLitters=new Set(['기본단가']); // 선택된 리터쳐들 (다중선택, 기본: 소속사 단가만)

function buildRateTabs(){
  document.getElementById('rate-tabs').innerHTML=Object.keys(RATES_RAW).map(function(k){
    return '<button class="rate-agency-btn'+(k===rtF?' on':'')+'" onclick="switchRate(this,\''+k+'\')">'+esc(k)+'</button>';
  }).join('');
  // 리터쳐 버튼 초기 활성화
  document.querySelectorAll('.rate-litter-btn').forEach(function(b){
    b.classList.toggle('on', selLitters.has(b.dataset.litter));
  });
}
function switchRate(el,k){
  rtF=k;rtP=0;
  document.querySelectorAll('#rate-tabs .rate-agency-btn').forEach(function(b){b.classList.remove('on');});
  el.classList.add('on');
  renderRates();
}
function switchLitter(litter, el){
  rtP=0;
  if(litter==='기본단가'){
    // 기본단가만 → 나머지 전부 해제하고 기본단가만 켜기
    selLitters=new Set(['기본단가']);
  } else if(litter==='all'){
    // 전체 → 기본단가 해제, 모든 리터쳐 선택
    selLitters=new Set(ALL_COLS);
  } else {
    // 개별 리터쳐 토글
    selLitters.delete('기본단가'); // 기본단가 모드 해제
    selLitters.delete('all');
    if(selLitters.has(litter)){
      selLitters.delete(litter);
      // 아무것도 없으면 기본단가로 복귀
      if(selLitters.size===0) selLitters=new Set(['기본단가']);
    } else {
      selLitters.add(litter);
    }
  }
  // 버튼 UI 업데이트
  document.querySelectorAll('.rate-litter-btn').forEach(function(b){
    b.classList.toggle('on', selLitters.has(b.dataset.litter));
  });
  // '전체' 버튼: 모든 리터쳐 선택됐을 때 on
  var allBtn=document.querySelector('.rate-litter-btn[data-litter="all"]');
  if(allBtn) allBtn.classList.toggle('on', ALL_COLS.every(function(c){return selLitters.has(c);}));
  renderRates();
}

function renderRates(){
  var rows=CUSTOM_RATES[rtF]||RATES_RAW[rtF]||[];
  var slice=rows.slice(rtP*PER,(rtP+1)*PER);

  // 현재 표시할 컬럼 계산
  var isBaseOnly=selLitters.has('기본단가')&&selLitters.size===1;
  var activeCols=ALL_COLS.filter(function(nm){return selLitters.has(nm);});
  var colCount=1+1+activeCols.length; // 항목+기본단가+리터쳐들

  // ── PC 테이블 헤더 ──
  var thCols='<th style="text-align:left">항목</th><th>기본단가</th>'
    +activeCols.map(function(nm){return '<th>'+esc(nm)+'</th>';}).join('');
  document.getElementById('rate-thead-pc').innerHTML='<tr>'+thCols+'</tr>';

  // ── PC 테이블 바디 ──
  document.getElementById('tb-rt').innerHTML=slice.map(function(r){
    var cols='<td class="proj-nm">'+esc(r[0])+'</td><td class="base-val">'+wn(r[1])+'</td>'
      +activeCols.map(function(nm){
        var idx=ALL_COLS.indexOf(nm);
        return '<td class="rate-val">'+wn(r[idx+2])+'</td>';
      }).join('');
    return '<tr>'+cols+'</tr>';
  }).join('')||'<tr><td colspan="'+colCount+'" style="padding:24px;text-align:center;color:var(--txt3);font-size:12px">데이터 없음</td></tr>';

  mkPg('pb-rt','pi-rt',rows.length,rtP,function(p){rtP=p;renderRates();});

  // ── 모바일 카드 ──
  var mCards='';
  slice.forEach(function(r){
    var bodyHtml='';
    activeCols.forEach(function(nm){
      var idx=ALL_COLS.indexOf(nm);
      var v=r[idx+2];
      bodyHtml+='<div class="rate-mc-row">'
        +'<span class="rate-mc-k">'+esc(nm)+'</span>'
        +'<span class="rate-mc-v">'+wn(v)+'</span>'
        +'</div>';
    });
    mCards+='<div class="rate-mc">'
      +'<div class="rate-mc-head"><span class="rate-mc-proj">'+esc(r[0])+'</span><span class="rate-mc-base">'+wn(r[1])+'</span></div>'
      +(bodyHtml?'<div class="rate-mc-body">'+bodyHtml+'</div>':'')
      +'</div>';
  });
  document.getElementById('rate-cards-mobile').innerHTML=mCards||'<div style="padding:24px;text-align:center;color:var(--txt3);font-size:12px">데이터 없음</div>';
  mkPg('pb-rt-m','pi-rt-m',rows.length,rtP,function(p){rtP=p;renderRates();});
}

// ── 수수료 편집 ──
function openRateEditMo(){
  document.getElementById('rate-edit-name').textContent=rtF;
  var feeRows=document.getElementById('fee-rows');
  feeRows.innerHTML=ALL_COLS.slice(0,6).map(function(nm){
    var fee=CUSTOM_FEES[nm]!==undefined?CUSTOM_FEES[nm]:0.8;
    var pct=Math.round((1-fee)*100);
    return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0">'
      +'<span style="font-size:12px;font-weight:600;min-width:60px">'+nm+'</span>'
      +'<input type="number" class="fi sm" style="width:65px;text-align:right" id="fee-'+nm+'" value="'+pct+'" min="0" max="50">'
      +'<span style="font-size:11px;color:var(--txt3)">% 수수료 → 지급 '+(100-pct)+'%</span>'
      +'</div>';
  }).join('');
  var baseRows=CUSTOM_RATES[rtF]?JSON.parse(JSON.stringify(CUSTOM_RATES[rtF])):JSON.parse(JSON.stringify(RATES_RAW[rtF]||[]));
  document.getElementById('rate-rows').innerHTML=baseRows.map(function(r,i){
    return '<div style="display:flex;align-items:center;gap:6px;padding:2px 0">'
      +'<span style="min-width:80px;font-size:11px;color:var(--txt2)">'+esc(r[0])+'</span>'
      +'<input type="number" class="fi sm" style="width:90px;text-align:right" id="rr-'+i+'" value="'+r[1]+'">'
      +'<span style="font-size:10px;color:var(--txt3)">원</span></div>';
  }).join('');
  openMo('mo-rate');
}
function saveRateEdit(){
  ALL_COLS.slice(0,6).forEach(function(nm){var el=document.getElementById('fee-'+nm);if(el)CUSTOM_FEES[nm]=1-parseFloat(el.value||'20')/100;});
  var baseRows=CUSTOM_RATES[rtF]?JSON.parse(JSON.stringify(CUSTOM_RATES[rtF])):JSON.parse(JSON.stringify(RATES_RAW[rtF]||[]));
  baseRows.forEach(function(r,i){var el=document.getElementById('rr-'+i);if(el){var base=parseInt(el.value)||r[1];r[1]=base;ALL_COLS.forEach(function(nm,ni){var fee=CUSTOM_FEES[nm]!==undefined?CUSTOM_FEES[nm]:0.8;r[ni+2]=Math.round(base*fee);});}});
  CUSTOM_RATES[rtF]=baseRows;saveDB();closeMo('mo-rate');renderRates();toast('저장됐어요!');
}

// ── 페이지네이션 ──
function mkPg(btnId,infoId,total,cur,cb){
  var pages=Math.ceil(total/PER)||1;
  var info=document.getElementById(infoId);if(info)info.textContent='총 '+total+'건';
  var c=document.getElementById(btnId);if(!c)return;c.innerHTML='';
  if(pages<=1)return;
  for(var i=0;i<pages;i++){(function(idx){var b=document.createElement('div');b.className='pg-btn'+(idx===cur?' on':'');b.textContent=idx+1;b.onclick=function(){cb(idx);};c.appendChild(b);})(i);}
}
function fltLt(f,el){ltF=f;ltP=0;document.querySelectorAll('#tab-litt .ft').forEach(function(b){b.classList.remove('on');});el.classList.add('on');renderLt();}

// ── CRUD ──
function openMo(id){document.getElementById(id).classList.add('open');}
function closeMo(id){document.getElementById(id).classList.remove('open');}
function saveAg(){
  if(!canEdit())return;
  var name=gv('ag-name');if(!name){toast('거래처명을 입력해주세요');return;}
  var obj={id:EI>=0?DB.agencies[EI].id:uid(),name:name,ceo:gv('ag-ceo'),biz:gv('ag-biz'),artists:gv('ag-artists'),manager:gv('ag-manager'),tel:gv('ag-tel'),email:gv('ag-email')};
  if(EI>=0)DB.agencies[EI]=obj;else DB.agencies.push(obj);
  saveDB();closeMo('mo-ag');renderAll();toast(EI>=0?'수정됐어요':'추가됐어요');
}
function editAg(id){
  if(!canEdit()){toast('편집 모드를 켜주세요');return;}
  var i=DB.agencies.findIndex(function(a){return a.id===id;});if(i<0)return;EI=i;var a=DB.agencies[i];
  document.getElementById('mo-ag-title').textContent='거래처 수정';
  document.getElementById('ag-name').value=a.name||'';document.getElementById('ag-ceo').value=a.ceo||'';
  document.getElementById('ag-biz').value=a.biz||'';document.getElementById('ag-artists').value=a.artists||'';
  document.getElementById('ag-manager').value=a.manager||'';document.getElementById('ag-tel').value=a.tel||'';
  document.getElementById('ag-email').value=a.email||'';openMo('mo-ag');
}
function delAg(id){if(!canEdit()){toast('편집 모드를 켜주세요');return;}if(!confirm('삭제할까요?'))return;DB.agencies=DB.agencies.filter(function(a){return a.id!==id;});saveDB();renderAll();toast('삭제됐어요');}
function saveLt(){
  if(!canEdit())return;
  var name=gv('lt-name');if(!name){toast('이름을 입력해주세요');return;}
  var obj={id:EI>=0?DB.litters[EI].id:uid(),name:name,tax:document.getElementById('lt-tax').value,regId:gv('lt-regid'),addr:gv('lt-addr'),ceo:gv('lt-ceo'),bank:document.getElementById('lt-bank').value,acct:gv('lt-acct'),email:gv('lt-email')};
  if(EI>=0)DB.litters[EI]=obj;else DB.litters.push(obj);
  saveDB();closeMo('mo-lt');renderAll();toast(EI>=0?'수정됐어요':'추가됐어요');
}
function editLt(id){
  if(!canEdit()){toast('편집 모드를 켜주세요');return;}
  var i=DB.litters.findIndex(function(l){return l.id===id;});if(i<0)return;EI=i;var l=DB.litters[i];
  document.getElementById('mo-lt-title').textContent='리터쳐 수정';
  document.getElementById('lt-name').value=l.name||'';document.getElementById('lt-tax').value=l.tax||'원천세';
  document.getElementById('lt-regid').value=l.regId||'';document.getElementById('lt-addr').value=l.addr||'';
  document.getElementById('lt-ceo').value=l.ceo||'';document.getElementById('lt-bank').value=l.bank||'IBK';
  document.getElementById('lt-acct').value=l.acct||'';document.getElementById('lt-email').value=l.email||'';
  openMo('mo-lt');
}
function delLt(id){if(!canEdit()){toast('편집 모드를 켜주세요');return;}if(!confirm('삭제할까요?'))return;DB.litters=DB.litters.filter(function(l){return l.id!==id;});saveDB();renderAll();toast('삭제됐어요');}

// ── 토스트 ──
var _tt;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},2200);}

document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchTab(t.dataset.tab);});});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.mo.open').forEach(function(m){m.classList.remove('open');});});
</script>
